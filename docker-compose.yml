version: '3.8'

services:
  backend:
    build: './backend'
    container_name: backend
    ports:
      - '8080:8080'
  frontend:
    build: './frontend'
    container_name: frontend
    ports:
      - '5173:5173'
  
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
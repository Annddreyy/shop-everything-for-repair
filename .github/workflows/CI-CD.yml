name: CI/CD

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'

jobs:
  lint-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: install frontend dependencies
        run: npm ci

      - name: run ESLint and Prettier
        run: npm run lint

  lint-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: install backend dependencies
        run: npm install

      - name: run ESLint and Prettier
        run: npm run lint
  
  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: install frontend dependencies
        run: npm ci
      
      - name: run tests
        run: npm run test:unit
      
      - name: run check tests coverage
        run: npm run check-coverage

  build-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: install dependencies
        run: npm ci
      
      - name: run build backend
        run: npm run build
  
  build-frontend:
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: frontend
      
      steps:
        - name: checkout code
          uses: actions/checkout@v3

        - name: setup Node.js
          uses: actions/setup-node@v3
          with:
            node-version: 18
        
        - name: install dependencies
          run: npm ci
        
        - name: run build frontend
          run: npm run build